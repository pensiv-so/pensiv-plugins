name: release

# Publishing happens at merge time, never on a plain push.
#
# On every push to `main` this runs the changesets action, which does one of two
# things depending on whether there are unconsumed changesets:
#
#   - some pending  → it opens/updates a "Version Packages" PR that bumps the
#                     versions and rewrites the changelogs. Nothing is published.
#   - none pending  → the version bumps are already on `main` (because that PR
#                     was merged), so it publishes every package whose version
#                     is ahead of the registry.
#
# So the only thing that ever triggers a publish is merging the Version Packages
# PR, which is a human clicking merge on a diff that shows exactly what will go
# out. `workflow_dispatch` stays for re-running a failed publish by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Opens/updates a "Version Packages" PR; when that PR is merged, publishes
      # any package with a consumed changeset to npm (with provenance).
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
